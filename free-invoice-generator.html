<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InvoiceMate Global — Free Online Invoice Generator</title>
  <meta name="description" content="Generate and download professional invoices online for free. Also available on Android — InvoiceMate Global." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    @media print {
      body * { visibility: hidden !important; }
      #printable-invoice, #printable-invoice * { visibility: visible !important; }
      #printable-invoice {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 20px !important;
        box-shadow: none !important;
        background: white !important;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.invoicemateglobal";

    function App() {
      const [view, setView] = useState("list");
      const [showBanner, setShowBanner] = useState(true);
      const [invoices, setInvoices] = useState(() => {
        const saved = localStorage.getItem("invoicemate_web_invoices");
        return saved ? JSON.parse(saved) : [];
      });
      const [currentInvoice, setCurrentInvoice] = useState(null);
      const [business, setBusiness] = useState(() => {
        const saved = localStorage.getItem("invoicemate_web_business");
        return saved ? JSON.parse(saved) : {
          name: "InvoiceMate Global",
          address: "123 High Street\nLondon\nSW1A 1AA",
          email: "support@invoicemateglobal.com",
          phone: "+44 20 1234 5678",
          vatNo: "GB12345",
          companyNo: "12345678",
          bankName: "Lloyds",
          sortCode: "20-40-50",
          accountNo: "12345678"
        };
      });

      useEffect(() => {
        localStorage.setItem("invoicemate_web_invoices", JSON.stringify(invoices));
      }, [invoices]);

      useEffect(() => {
        localStorage.setItem("invoicemate_web_business", JSON.stringify(business));
      }, [business]);

      const createNewInvoiceState = () => ({
        id: "INV-" + String(invoices.length + 1).padStart(4, "0"),
        status: "UNPAID",
        clientName: "",
        clientEmail: "",
        clientPhone: "",
        clientAddress: "",
        issueDate: new Date().toISOString().split("T")[0],
        dueDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split("T")[0],
        items: [{ description: "", qty: 1, unitPrice: 0, vatPercent: 20, discount: 0 }],
        notes: "Payment cash / bank transfer"
      });

      const handleSaveInvoice = (inv) => {
        const idx = invoices.findIndex((i) => i.id === inv.id);
        if (idx >= 0) {
          const updated = [...invoices];
          updated[idx] = inv;
          setInvoices(updated);
        } else {
          setInvoices([inv, ...invoices]);
        }
        setCurrentInvoice(inv);
        setView("preview");
      };

      const toggleStatus = (inv) => {
        const newStatus = inv.status === "PAID" ? "UNPAID" : "PAID";
        const updated = { ...inv, status: newStatus };
        handleSaveInvoice(updated);
      };

      const handleDeleteInvoice = (id) => {
        setInvoices(invoices.filter((i) => i.id !== id));
        setView("list");
      };

      const calculateTotals = (inv) => {
        let subtotal = 0;
        let totalVat = 0;
        (inv.items || []).forEach((item) => {
          const raw = (Number(item.qty) || 0) * (Number(item.unitPrice) || 0);
          const disc = (raw * (Number(item.discount) || 0)) / 100;
          const net = raw - disc;
          const vat = (net * (Number(item.vatPercent) || 0)) / 100;
          subtotal += net;
          totalVat += vat;
        });
        return { subtotal, totalVat, total: subtotal + totalVat };
      };

      return (
        <div class="flex flex-col min-h-screen">
          {/* Top Promo Banner */}
          {showBanner && (
            <div class="no-print bg-gradient-to-r from-indigo-700 via-purple-700 to-indigo-800 text-white px-4 py-2.5 flex items-center justify-between shadow-md text-sm">
              <div class="flex items-center gap-3">
                <div class="bg-white text-indigo-700 p-1 rounded font-black text-xs">IM</div>
                <span><strong>InvoiceMate Global</strong> — Manage invoices, client ledgers, and expenses on Android.</span>
              </div>
              <div class="flex items-center gap-3">
                <a
                  href={PLAY_STORE_URL}
                  target="_blank"
                  rel="noopener noreferrer"
                  class="bg-white text-indigo-900 hover:bg-slate-100 font-bold px-3 py-1 rounded text-xs transition shadow"
                >
                  Get on Google Play ➔
                </a>
                <button onClick={() => setShowBanner(false)} class="text-white/75 hover:text-white font-bold ml-2">✕</button>
              </div>
            </div>
          )}

          <div class="flex flex-1">
            {/* Sidebar */}
            <aside class="no-print w-64 bg-slate-900 text-slate-300 flex flex-col justify-between p-4 hidden md:flex border-r border-slate-800">
              <div>
                <div class="flex items-center gap-3 px-2 py-4 mb-4 border-b border-slate-800">
                  <div class="h-8 w-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-black">IM</div>
                  <span class="text-lg font-bold text-white tracking-wide">Invoicer</span>
                </div>

                <nav class="space-y-1">
                  <button
                    onClick={() => setView("list")}
                    class={`w-full text-left px-3 py-2.5 rounded-lg flex items-center gap-3 text-sm font-medium transition ${
                      view === "list" ? "bg-indigo-600 text-white" : "hover:bg-slate-800 text-slate-300"
                    }`}
                  >
                    📁 Invoices ({invoices.length})
                  </button>
                  <button
                    onClick={() => {
                      setCurrentInvoice(createNewInvoiceState());
                      setView("create");
                    }}
                    class={`w-full text-left px-3 py-2.5 rounded-lg flex items-center gap-3 text-sm font-medium transition ${
                      view === "create" ? "bg-indigo-600 text-white" : "hover:bg-slate-800 text-slate-300"
                    }`}
                  >
                    ➕ New Invoice
                  </button>
                  <button
                    onClick={() => setView("settings")}
                    class={`w-full text-left px-3 py-2.5 rounded-lg flex items-center gap-3 text-sm font-medium transition ${
                      view === "settings" ? "bg-indigo-600 text-white" : "hover:bg-slate-800 text-slate-300"
                    }`}
                  >
                    ⚙️ Business Settings
                  </button>
                </nav>
              </div>

              {/* Sidebar Play Store Badge */}
              <div class="bg-slate-800/80 rounded-xl p-3 border border-slate-700/60 text-center">
                <p class="text-xs text-slate-400 font-semibold mb-2 uppercase tracking-wider">Also on Android</p>
                <a href={PLAY_STORE_URL} target="_blank" rel="noopener noreferrer" class="inline-block hover:opacity-90 transition">
                  <img
                    src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png"
                    alt="Get it on Google Play"
                    class="h-10 mx-auto"
                  />
                </a>
              </div>
            </aside>

            {/* Main Content */}
            <main class="flex-1 p-6 md:p-8 max-w-5xl mx-auto w-full">
              {view === "list" && (
                <div>
                  <div class="flex justify-between items-center mb-6">
                    <div>
                      <h1 class="text-2xl font-black text-slate-900">Invoices</h1>
                      <p class="text-sm text-slate-500">{invoices.length} total invoices</p>
                    </div>
                    <button
                      onClick={() => {
                        setCurrentInvoice(createNewInvoiceState());
                        setView("create");
                      }}
                      class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-bold shadow transition flex items-center gap-2 text-sm"
                    >
                      ➕ Create Invoice
                    </button>
                  </div>

                  {invoices.length === 0 ? (
                    <div class="bg-white rounded-2xl border border-dashed border-slate-300 p-12 text-center my-8">
                      <div class="text-4xl mb-3">📄</div>
                      <h3 class="text-lg font-bold text-slate-800">No invoices yet</h3>
                      <p class="text-sm text-slate-500 mb-4">Create your first invoice to generate and print PDF documents.</p>
                      <button
                        onClick={() => {
                          setCurrentInvoice(createNewInvoiceState());
                          setView("create");
                        }}
                        class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-semibold transition"
                      >
                        Create Invoice
                      </button>
                    </div>
                  ) : (
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                      <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                          <tr>
                            <th class="p-4">Invoice #</th>
                            <th class="p-4">Client</th>
                            <th class="p-4">Date</th>
                            <th class="p-4">Total</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-right">Action</th>
                          </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 text-sm">
                          {invoices.map((inv) => {
                            const { total } = calculateTotals(inv);
                            return (
                              <tr key={inv.id} class="hover:bg-slate-50 transition">
                                <td class="p-4 font-bold text-indigo-600">{inv.id}</td>
                                <td class="p-4 font-medium text-slate-900">{inv.clientName || "Unnamed Client"}</td>
                                <td class="p-4 text-slate-500">{inv.issueDate}</td>
                                <td class="p-4 font-bold text-slate-900">£{total.toFixed(2)}</td>
                                <td class="p-4">
                                  <button
                                    onClick={() => toggleStatus(inv)}
                                    title="Click to toggle Paid/Unpaid"
                                    class={`px-2.5 py-1 rounded-full text-xs font-bold transition ${
                                      inv.status === "PAID"
                                        ? "bg-emerald-100 text-emerald-800 hover:bg-emerald-200"
                                        : "bg-amber-100 text-amber-800 hover:bg-amber-200"
                                    }`}
                                  >
                                    {inv.status} ⟳
                                  </button>
                                </td>
                                <td class="p-4 text-right">
                                  <button
                                    onClick={() => {
                                      setCurrentInvoice(inv);
                                      setView("preview");
                                    }}
                                    class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1 rounded-md text-xs font-semibold transition"
                                  >
                                    View / Print
                                  </button>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              )}

              {view === "create" && (
                <InvoiceForm
                  invoice={currentInvoice}
                  onSave={handleSaveInvoice}
                  onCancel={() => setView("list")}
                />
              )}

              {view === "preview" && currentInvoice && (
                <div>
                  {/* Clean Action Toolbar (Only Print, Edit, Delete) */}
                  <div class="no-print flex items-center justify-between mb-6 pb-4 border-b border-slate-200">
                    <button
                      onClick={() => setView("list")}
                      class="text-sm font-semibold text-slate-600 hover:text-slate-900 flex items-center gap-1"
                    >
                      ← Dashboard
                    </button>

                    <div class="flex items-center gap-3">
                      <button
                        onClick={() => window.print()}
                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-bold text-sm shadow transition flex items-center gap-2"
                      >
                        🖨️ Print / Save as PDF
                      </button>
                      <button
                        onClick={() => setView("create")}
                        class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 px-3.5 py-2 rounded-lg text-sm font-semibold transition"
                      >
                        ✏️ Edit
                      </button>
                      <button
                        onClick={() => handleDeleteInvoice(currentInvoice.id)}
                        class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-3.5 py-2 rounded-lg text-sm font-semibold transition"
                      >
                        🗑️ Delete
                      </button>
                    </div>
                  </div>

                  {/* Printable Clean Invoice */}
                  <div id="printable-invoice" class="bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden max-w-4xl mx-auto">
                    <div class="bg-slate-900 text-white p-8">
                      <div class="flex justify-between items-start">
                        <div>
                          <h2 class="text-2xl font-bold tracking-tight">{business.name}</h2>
                          <p class="text-xs text-slate-400 whitespace-pre-line mt-1">{business.address}</p>
                          <p class="text-xs text-slate-400 mt-1">{business.email} • {business.phone}</p>
                          <p class="text-xs text-slate-400 mt-1">VAT: {business.vatNo} • Co. No: {business.companyNo}</p>
                        </div>
                        <div class="text-right">
                          <h1 class="text-3xl font-black tracking-widest text-slate-100">INVOICE</h1>
                          <p class="text-sm text-slate-400 font-bold mt-1">{currentInvoice.id}</p>
                          <button
                            onClick={() => toggleStatus(currentInvoice)}
                            title="Click to toggle Paid/Unpaid"
                            class={`inline-block mt-2 px-3 py-1 rounded text-xs font-bold border transition ${
                              currentInvoice.status === "PAID"
                                ? "bg-emerald-600/30 text-emerald-300 border-emerald-500/40 hover:bg-emerald-600/50"
                                : "bg-amber-600/30 text-amber-300 border-amber-500/40 hover:bg-amber-600/50"
                            }`}
                          >
                            {currentInvoice.status} ⟳
                          </button>
                        </div>
                      </div>
                    </div>

                    <div class="p-8 grid grid-cols-2 md:grid-cols-4 gap-6 bg-slate-50/70 border-b border-slate-200 text-xs">
                      <div>
                        <span class="text-slate-400 uppercase font-bold tracking-wider block mb-1">Bill To</span>
                        <p class="font-bold text-slate-900 text-sm">{currentInvoice.clientName || "—"}</p>
                        <p class="text-slate-600 whitespace-pre-line mt-1">{currentInvoice.clientAddress}</p>
                      </div>
                      <div>
                        <span class="text-slate-400 uppercase font-bold tracking-wider block mb-1">Email / Phone</span>
                        <p class="text-slate-800 font-medium">{currentInvoice.clientEmail || "—"}</p>
                        <p class="text-slate-800 font-medium">{currentInvoice.clientPhone || "—"}</p>
                      </div>
                      <div>
                        <span class="text-slate-400 uppercase font-bold tracking-wider block mb-1">Issue Date</span>
                        <p class="text-slate-800 font-semibold">{currentInvoice.issueDate}</p>
                      </div>
                      <div>
                        <span class="text-slate-400 uppercase font-bold tracking-wider block mb-1">Due Date</span>
                        <p class="text-slate-800 font-semibold">{currentInvoice.dueDate}</p>
                      </div>
                    </div>

                    <div class="p-8">
                      <table class="w-full text-left text-xs mb-8">
                        <thead>
                          <tr class="border-b border-slate-200 text-slate-400 uppercase font-bold pb-2">
                            <th class="py-2">Description</th>
                            <th class="py-2 text-center">Qty</th>
                            <th class="py-2 text-right">Unit Price</th>
                            <th class="py-2 text-center">VAT</th>
                            <th class="py-2 text-right">Net</th>
                            <th class="py-2 text-right">VAT Amt</th>
                            <th class="py-2 text-right">Total</th>
                          </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                          {currentInvoice.items.map((item, i) => {
                            const raw = (Number(item.qty) || 0) * (Number(item.unitPrice) || 0);
                            const net = raw - (raw * (Number(item.discount) || 0)) / 100;
                            const vatAmt = (net * (Number(item.vatPercent) || 0)) / 100;
                            const itemTotal = net + vatAmt;
                            return (
                              <tr key={i}>
                                <td class="py-3 font-semibold text-slate-800">{item.description || "Item"}</td>
                                <td class="py-3 text-center text-slate-600">{item.qty}</td>
                                <td class="py-3 text-right text-slate-600">£{Number(item.unitPrice).toFixed(2)}</td>
                                <td class="py-3 text-center text-slate-600">{item.vatPercent}%</td>
                                <td class="py-3 text-right text-slate-600">£{net.toFixed(2)}</td>
                                <td class="py-3 text-right text-slate-600">£{vatAmt.toFixed(2)}</td>
                                <td class="py-3 text-right font-bold text-slate-900">£{itemTotal.toFixed(2)}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>

                      {(() => {
                        const { subtotal, totalVat, total } = calculateTotals(currentInvoice);
                        return (
                          <div class="flex justify-end border-t border-slate-200 pt-4">
                            <div class="w-64 space-y-2 text-xs">
                              <div class="flex justify-between text-slate-600">
                                <span>Subtotal (excl. VAT):</span>
                                <span class="font-medium">£{subtotal.toFixed(2)}</span>
                              </div>
                              <div class="flex justify-between text-slate-600">
                                <span>VAT Total:</span>
                                <span class="font-medium">£{totalVat.toFixed(2)}</span>
                              </div>
                              <div class="flex justify-between text-base font-black text-slate-900 border-t border-slate-200 pt-2">
                                <span>Total Due:</span>
                                <span>£{total.toFixed(2)}</span>
                              </div>
                            </div>
                          </div>
                        );
                      })()}

                      <div class="mt-8 pt-6 border-t border-slate-100 grid grid-cols-2 gap-4 text-xs text-slate-500">
                        <div>
                          <span class="font-bold text-slate-700 uppercase block mb-1">Payment Details</span>
                          <p>Bank: {business.bankName}</p>
                          <p>Sort Code: {business.sortCode} • Account No: {business.accountNo}</p>
                        </div>
                        <div>
                          <span class="font-bold text-slate-700 uppercase block mb-1">Notes</span>
                          <p>{currentInvoice.notes || "Thank you for your business."}</p>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {view === "settings" && (
                <BusinessSettings business={business} onSave={(b) => { setBusiness(b); setView("list"); }} />
              )}
            </main>
          </div>
        </div>
      );
    }

    function InvoiceForm({ invoice, onSave, onCancel }) {
      const [form, setForm] = useState(invoice);

      const updateItem = (index, field, val) => {
        const items = [...form.items];
        items[index][field] = val;
        setForm({ ...form, items });
      };

      const addItem = () => {
        setForm({
          ...form,
          items: [...form.items, { description: "", qty: 1, unitPrice: 0, vatPercent: 20, discount: 0 }]
        });
      };

      const removeItem = (index) => {
        setForm({ ...form, items: form.items.filter((_, i) => i !== index) });
      };

      return (
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
          <h2 class="text-xl font-bold text-slate-900 mb-6 pb-4 border-b border-slate-100">Invoice Details</h2>

          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Invoice Number</label>
              <input
                type="text"
                value={form.id}
                onChange={(e) => setForm({ ...form, id: e.target.value })}
                class="w-full border border-slate-300 rounded-lg p-2.5 text-sm font-bold text-indigo-600"
              />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Status</label>
              <select
                value={form.status}
                onChange={(e) => setForm({ ...form, status: e.target.value })}
                class="w-full border border-slate-300 rounded-lg p-2.5 text-sm font-semibold bg-white"
              >
                <option value="PAID">PAID</option>
                <option value="UNPAID">UNPAID</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Issue Date</label>
              <input
                type="date"
                value={form.issueDate}
                onChange={(e) => setForm({ ...form, issueDate: e.target.value })}
                class="w-full border border-slate-300 rounded-lg p-2.5 text-sm"
              />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Due Date</label>
              <input
                type="date"
                value={form.dueDate}
                onChange={(e) => setForm({ ...form, dueDate: e.target.value })}
                class="w-full border border-slate-300 rounded-lg p-2.5 text-sm"
              />
            </div>
          </div>

          <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-3">Client Details</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <input
              type="text"
              placeholder="Customer / Company Name *"
              value={form.clientName}
              onChange={(e) => setForm({ ...form, clientName: e.target.value })}
              class="border border-slate-300 rounded-lg p-2.5 text-sm"
            />
            <input
              type="email"
              placeholder="Client Email"
              value={form.clientEmail}
              onChange={(e) => setForm({ ...form, clientEmail: e.target.value })}
              class="border border-slate-300 rounded-lg p-2.5 text-sm"
            />
            <input
              type="tel"
              placeholder="Phone Number"
              value={form.clientPhone}
              onChange={(e) => setForm({ ...form, clientPhone: e.target.value })}
              class="border border-slate-300 rounded-lg p-2.5 text-sm"
            />
            <input
              type="text"
              placeholder="Billing Address"
              value={form.clientAddress}
              onChange={(e) => setForm({ ...form, clientAddress: e.target.value })}
              class="border border-slate-300 rounded-lg p-2.5 text-sm"
            />
          </div>

          <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-3">Items</h3>
          <div class="space-y-3 mb-6">
            {form.items.map((item, idx) => (
              <div key={idx} class="grid grid-cols-12 gap-2 items-center bg-slate-50 p-3 rounded-lg border border-slate-200 text-sm">
                <input
                  type="text"
                  placeholder="Item description"
                  value={item.description}
                  onChange={(e) => updateItem(idx, "description", e.target.value)}
                  class="col-span-5 border border-slate-300 rounded p-2 bg-white"
                />
                <input
                  type="number"
                  placeholder="Qty"
                  value={item.qty}
                  onChange={(e) => updateItem(idx, "qty", e.target.value)}
                  class="col-span-2 border border-slate-300 rounded p-2 bg-white text-center"
                />
                <input
                  type="number"
                  step="0.01"
                  placeholder="Price"
                  value={item.unitPrice}
                  onChange={(e) => updateItem(idx, "unitPrice", e.target.value)}
                  class="col-span-2 border border-slate-300 rounded p-2 bg-white text-right"
                />
                <select
                  value={item.vatPercent}
                  onChange={(e) => updateItem(idx, "vatPercent", Number(e.target.value))}
                  class="col-span-2 border border-slate-300 rounded p-2 bg-white"
                >
                  <option value={0}>0% VAT</option>
                  <option value={5}>5% VAT</option>
                  <option value={20}>20% VAT</option>
                </select>
                <button
                  type="button"
                  onClick={() => removeItem(idx)}
                  class="col-span-1 text-rose-500 font-bold hover:text-rose-700 text-center"
                >
                  ✕
                </button>
              </div>
            ))}
            <button
              type="button"
              onClick={addItem}
              class="text-xs font-bold text-indigo-600 hover:text-indigo-800 py-1"
            >
              ➕ Add Line Item
            </button>
          </div>

          <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
            <button
              type="button"
              onClick={onCancel}
              class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-semibold text-slate-700 hover:bg-slate-50"
            >
              Cancel
            </button>
            <button
              type="button"
              onClick={() => onSave(form)}
              class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-bold shadow"
            >
              Save & Preview
            </button>
          </div>
        </div>
      );
    }

            </div>
            <div class="grid grid-cols-2 gap-4">

                <label class="block text-xs font-bold text-slate-600 mb-1">Email</label>
                <input

                  class="w-full border border-slate-300 rounded-lg p-2.5"
                />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Phone</label>
                <input
                  type="tel"

                  onChange={(e) => setForm({ ...form, phone: e.target.value })}
                  class="w-full border border-slate-300 rounded-lg p-2.5"
                />
              </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">VAT Number</label>
                <input
                  type="text"
                  value={form.vatNo}
                  onChange={(e) => setForm({ ...form, vatNo: e.target.value })}
                  class="w-full border border-slate-300 rounded-lg p-2.5"
                />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Company Number</label>
                <input

                />
              </div>
            </div>
            <div class="grid grid-cols-3 gap-3">
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Bank Name</label>
                <input
                  type="text"
                  value={form.bankName}
                  onChange={(e) => setForm({ ...form, bankName: e.target.value })}
                  class="w-full border border-slate-300 rounded-lg p-2"
                />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Sort Code</label>
                <input
                  type="text"
                  value={form.sortCode}
                  onChange={(e) => setForm({ ...form, sortCode: e.target.value })}
                  class="w-full border border-slate-300 rounded-lg p-2"
                />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Account Number</label>
                <input
                  type="text"
                  value={form.accountNo}
                  onChange={(e) => setForm({ ...form, accountNo: e.target.value })}
                  class="w-full border border-slate-300 rounded-lg p-2"
                />
              </div>
            </div>
            <button
              type="button"
              onClick={() => onSave(form)}
              class="mt-4 bg-slate-900 text-white font-bold px-5 py-2.5 rounded-lg hover:bg-slate-800 transition"
            >
              Save Settings
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
