// ─── HELPERS ─────────────────────────────────────────────────────────────────
const uid    = () => Math.random().toString(36).slice(2, 9);
const today  = () => new Date().toISOString().split("T")[0];
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().split("T")[0]; };
const fmt    = (n, sym = "£") => `${sym}${Number(n).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
const fmtDate = s => { if (!s) return "—"; try { return new Date(s).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }); } catch { return s; } };

const calcLine = item => {
  const gross = item.qty * item.price;
  const disc  = (gross * (item.discount || 0)) / 100;
  const net   = gross - disc;
  const vat   = (net * (item.vatRate || 0)) / 100;
  return { net: +net.toFixed(2), disc: +disc.toFixed(2), vat: +vat.toFixed(2), total: +(net + vat).toFixed(2) };
};

const calcTotals = items => {
  let sub = 0, disc = 0, vat = 0;
  items.forEach(it => { const r = calcLine(it); sub += r.net; disc += r.disc; vat += r.vat; });
  return { subtotal: +sub.toFixed(2), totalDisc: +disc.toFixed(2), totalVat: +vat.toFixed(2), total: +(sub + vat).toFixed(2) };
};

const nextNum = (invoices, prefix) => {
  const nums = invoices.map(i => parseInt(i.number.replace(/\D/g, ""), 10) || 0);
  return `${prefix}-${String((nums.length ? Math.max(...nums) : 0) + 1).padStart(4, "0")}`;
};

// ─── IN-MEMORY STORE ─────────────────────────────────────────────────────────
const STORE = (() => {
  let inv = [];
  let biz = { name: "Your Business Ltd", address: "123 High Street\nLondon\nSW1A 1AA", email: "hello@yourbusiness.co.uk", phone: "+44 20 1234 5678", website: "", vatNumber: "", regNumber: "", bankName: "", sortCode: "", accountNumber: "", logo: "", prefix: "INV", defaultVat: 20, currency: "GBP", sym: "£" };
  return {
    getInv: ()  => inv,
    getBiz: ()  => biz,
    saveBiz: b  => { biz = { ...b }; },
    saveInv: i  => { const idx = inv.findIndex(x => x.id === i.id); idx >= 0 ? (inv[idx] = i) : inv.unshift(i); },
    delInv:  id => { inv = inv.filter(i => i.id !== id); },
    toggle:  id => { inv = inv.map(i => i.id === id ? { ...i, status: i.status === "paid" ? "unpaid" : "paid" } : i); },
  };
})();

// ─── SHARED UI COMPONENTS ────────────────────────────────────────────────────
const S = {

  secondary: { background: "#fff", color: "#475569", border: "1px solid #e2e8f0" },
  ghost:     { background: "transparent", color: "#64748b", border: "none" },
  danger:    { background: "#fef2f2", color: "#dc2626", border: "1px solid #fecaca" },
  success:   { background: "#16a34a", color: "#fff", border: "none" },
};
const SZ = { sm: { padding: "6px 12px", fontSize: 12 }, md: { padding: "9px 16px", fontSize: 13 }, lg: { padding: "12px 20px", fontSize: 14 } };

const Btn = ({ children, onClick, variant = "primary", size = "md", disabled }) => (
  <button onClick={onClick} disabled={disabled}
    style={{ ...S[variant], ...SZ[size], display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6, fontWeight: 600, borderRadius: 10, cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.45 : 1, transition: "opacity .15s", fontFamily: "inherit" }}>
    {children}
  </button>
);

const inputStyle = { padding: "8px 12px", borderRadius: 10, border: "1px solid #e2e8f0", background: "#f8fafc", fontSize: 13, color: "#0f172a", outline: "none", fontFamily: "inherit", width: "100%", boxSizing: "border-box", display: "block" };
const labelStyle = { display: "block", fontSize: 11, fontWeight: 700, color: "#64748b", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 4 };

const Field = ({ label, children, style = {} }) => (
  <div style={style}>
    {label && <label style={labelStyle}>{label}</label>}
    {children}
  </div>
);

const TInput = ({ label, value, onChange, type = "text", placeholder = "", style = {} }) => (
  <Field label={label} style={style}>
    <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} style={inputStyle} />
  </Field>
);

const TTextarea = ({ label, value, onChange, rows = 3, placeholder = "", style = {} }) => (
  <Field label={label} style={style}>
    <textarea value={value} onChange={e => onChange(e.target.value)} rows={rows} placeholder={placeholder} style={{ ...inputStyle, resize: "vertical" }} />
  </Field>
);

const TSelect = ({ label, value, onChange, options, style = {} }) => (
  <Field label={label} style={style}>
    <div style={{ position: "relative" }}>
      <select value={value} onChange={e => onChange(e.target.value)} style={{ ...inputStyle, appearance: "none", paddingRight: 28, cursor: "pointer" }}>

      <span style={{ position: "absolute", right: 9, top: "50%", transform: "translateY(-50%)", pointerEvents: "none", color: "#94a3b8" }}>
        <Icon d={IC.chevron} size={13} />
      </span>
    </div>

);

const Card = ({ children, style = {} }) => (
  <div style={{ background: "#fff", border: "1px solid #e2e8f0", borderRadius: 16, padding: 20, ...style }}>{children}</div>
);

const SecTitle = ({ children }) => (
  <p style={{ margin: "0 0 14px", fontSize: 11, fontWeight: 700, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.08em" }}>{children}</p>
);

const Badge = ({ status, onClick }) => (

    {status}

// ─── INVOICE PREVIEW ─────────────────────────────────────────────────────────
const InvoicePreview = ({ invoice, business }) => {
  const sym    = business.sym || "£";
  const totals = calcTotals(invoice.items);
  const isPaid = invoice.status === "paid";
  return (
    <div id="invoice-preview-print" style={{ background: "#fff", fontFamily: "Inter,system-ui,sans-serif" }}>
      {/* Dark header */}
      <div style={{ background: "#0f172a", padding: "28px 36px", display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div>
          {business.logo && <img src={business.logo} alt="" style={{ height: 48, maxWidth: 120, objectFit: "contain", marginBottom: 10, borderRadius: 6 }} />}
          <div style={{ color: "#fff", fontWeight: 700, fontSize: 17 }}>{business.name || "Your Business"}</div>
          <div style={{ color: "#94a3b8", fontSize: 11, marginTop: 4, whiteSpace: "pre-line" }}>{business.address}</div>
          {business.email      && <div style={{ color: "#94a3b8", fontSize: 11 }}>{business.email}</div>}
          {business.phone      && <div style={{ color: "#94a3b8", fontSize: 11 }}>{business.phone}</div>}
          {business.vatNumber  && <div style={{ color: "#64748b", fontSize: 11 }}>VAT: {business.vatNumber}</div>}
          {business.regNumber  && <div style={{ color: "#64748b", fontSize: 11 }}>Co. No: {business.regNumber}</div>}
        </div>
        <div style={{ textAlign: "right" }}>
          <div style={{ color: "#fff", fontWeight: 800, fontSize: 32, letterSpacing: "-0.02em" }}>INVOICE</div>
          <div style={{ color: "#64748b", fontFamily: "monospace", fontSize: 13 }}>{invoice.number}</div>
          <div style={{ marginTop: 10, display: "inline-block", padding: "3px 14px", borderRadius: 999, background: isPaid ? "#166534" : "#78350f", color: isPaid ? "#86efac" : "#fde68a", fontSize: 11, fontWeight: 700, textTransform: "uppercase" }}>
            {invoice.status}
          </div>
        </div>
      </div>

      {/* Meta grid */}
      <div style={{ padding: "22px 36px", display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 18, borderBottom: "1px solid #f1f5f9" }}>
        {[{ label: "Bill To", value: invoice.customer.name || "—", bold: true }, { label: "Email", value: invoice.customer.email || "—" }, { label: "Issue Date", value: fmtDate(invoice.issueDate) }, { label: "Due Date", value: fmtDate(invoice.dueDate) }].map(({ label, value, bold }) => (
          <div key={label}>
            <div style={{ fontSize: 10, fontWeight: 700, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 3 }}>{label}</div>
            <div style={{ fontSize: 13, fontWeight: bold ? 700 : 500, color: "#0f172a" }}>{value}</div>
          </div>
        ))}
      </div>
      {invoice.customer.address && (
        <div style={{ padding: "0 36px 14px" }}>
          <div style={{ fontSize: 10, fontWeight: 700, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 3 }}>Address</div>
          <div style={{ fontSize: 12, color: "#475569", whiteSpace: "pre-line" }}>{invoice.customer.address}</div>
        </div>
      )}

      {/* Items table */}
      <div style={{ padding: "0 36px" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
          <thead>
            <tr style={{ background: "#f8fafc" }}>
              {["Description","Qty","Unit Price","Disc.","VAT","Net","VAT Amt","Total"].map((h, i) => (
                <th key={h} style={{ padding: "9px 10px", textAlign: i === 0 ? "left" : "right", fontSize: 10, fontWeight: 700, color: "#64748b", textTransform: "uppercase", letterSpacing: "0.05em", borderBottom: "1px solid #e2e8f0" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {invoice.items.map((item, idx) => {
              const { net, vat, total } = calcLine(item);
              return (
                <tr key={item.id} style={{ background: idx % 2 === 0 ? "#fff" : "#f8fafc" }}>
                  <td style={{ padding: "8px 10px", fontWeight: 500, color: "#0f172a" }}>{item.desc || "—"}</td>
                  <td style={{ padding: "8px 10px", textAlign: "right", color: "#475569" }}>{item.qty}</td>
                  <td style={{ padding: "8px 10px", textAlign: "right", color: "#475569" }}>{fmt(item.price, sym)}</td>
                  <td style={{ padding: "8px 10px", textAlign: "right", color: "#475569" }}>{item.discount ? `${item.discount}%` : "—"}</td>
                  <td style={{ padding: "8px 10px", textAlign: "right", color: "#475569" }}>{item.vatRate}%</td>
                  <td style={{ padding: "8px 10px", textAlign: "right", color: "#475569" }}>{fmt(net, sym)}</td>
                  <td style={{ padding: "8px 10px", textAlign: "right", color: "#475569" }}>{fmt(vat, sym)}</td>
                  <td style={{ padding: "8px 10px", textAlign: "right", fontWeight: 700, color: "#0f172a" }}>{fmt(total, sym)}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* Totals */}
      <div style={{ padding: "20px 36px", display: "flex", justifyContent: "flex-end" }}>
        <div style={{ width: 280 }}>
          {[["Subtotal (excl. VAT)", fmt(totals.subtotal, sym)], ...(totals.totalDisc > 0 ? [["Discount", `-${fmt(totals.totalDisc, sym)}`]] : []), ["VAT", fmt(totals.totalVat, sym)]].map(([l, v]) => (
            <div key={l} style={{ display: "flex", justifyContent: "space-between", padding: "4px 0", fontSize: 12, color: "#475569" }}><span>{l}</span><span>{v}</span></div>
          ))}
          <div style={{ height: 1, background: "#e2e8f0", margin: "8px 0" }} />
          <div style={{ background: "#0f172a", borderRadius: 10, padding: "11px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ color: "#fff", fontWeight: 700, fontSize: 13 }}>Total Due</span>
            <span style={{ color: "#fff", fontWeight: 800, fontSize: 18, fontFamily: "monospace" }}>{fmt(totals.total, sym)}</span>
          </div>
        </div>
      </div>

      {/* Bank details */}
      {(business.bankName || business.sortCode || business.accountNumber) && (
        <div style={{ padding: "0 36px 16px" }}>
          <div style={{ background: "#f8fafc", borderRadius: 10, padding: "14px 18px" }}>
            <div style={{ fontSize: 10, fontWeight: 700, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 8 }}>Payment Details</div>
            <div style={{ display: "flex", gap: 24, flexWrap: "wrap" }}>
              {[["Bank", business.bankName], ["Sort Code", business.sortCode], ["Account No.", business.accountNumber]].filter(([,v]) => v).map(([l, v]) => (
                <div key={l}>
                  <div style={{ fontSize: 10, color: "#94a3b8", marginBottom: 1 }}>{l}</div>
                  <div style={{ fontSize: 12, fontWeight: 600, color: "#0f172a", fontFamily: "monospace" }}>{v}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* Notes */}
      {invoice.notes && (
        <div style={{ padding: "0 36px 16px" }}>
          <div style={{ fontSize: 10, fontWeight: 700, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 4 }}>Notes</div>
          <div style={{ fontSize: 12, color: "#64748b", whiteSpace: "pre-line" }}>{invoice.notes}</div>
        </div>
      )}

      <div style={{ padding: "14px 36px", borderTop: "1px solid #f1f5f9", textAlign: "center", fontSize: 10, color: "#94a3b8" }}>
        Thank you for your business · Generated {fmtDate(new Date().toISOString())}
      </div>
    </div>
  );
};

// ─── DASHBOARD ───────────────────────────────────────────────────────────────
const Dashboard = ({ invoices, business, onView, onNew, onToggle, onDelete }) => {
  const [search, setSearch] = useState("");
  const [filter, setFilter] = useState("all");
  const sym = business.sym || "£";

  const stats = useMemo(() => {
    let total = 0, paid = 0, unpaid = 0;
    invoices.forEach(inv => { const t = calcTotals(inv.items).total; total += t; if (inv.status === "paid") paid += t; else unpaid += t; });
    return { total, paid, unpaid, count: invoices.length };
  }, [invoices]);

  const filtered = useMemo(() => invoices.filter(inv =>
    (filter === "all" || inv.status === filter) &&
    (inv.number.toLowerCase().includes(search.toLowerCase()) || inv.customer.name.toLowerCase().includes(search.toLowerCase()))
  ), [invoices, filter, search]);

  return (
    <div style={{ padding: "24px 0" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 22, flexWrap: "wrap", gap: 12 }}>
        <div>
          <h1 style={{ margin: 0, fontSize: 24, fontWeight: 800, color: "#0f172a", letterSpacing: "-0.02em" }}>Invoices</h1>
          <p style={{ margin: "3px 0 0", color: "#64748b", fontSize: 13 }}>{stats.count} total · {invoices.filter(i => i.status === "unpaid").length} outstanding</p>
        </div>
        <Btn onClick={onNew}><Icon d={IC.plus} size={14} /> New Invoice</Btn>
      </div>

      {/* Stats */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 12, marginBottom: 20 }}>
        {[{ l: "Invoices", v: stats.count, c: "#0f172a", mono: true }, { l: "Total Value", v: fmt(stats.total, sym), c: "#0f172a" }, { l: "Paid", v: fmt(stats.paid, sym), c: "#16a34a" }, { l: "Outstanding", v: fmt(stats.unpaid, sym), c: "#d97706" }].map(({ l, v, c, mono }) => (
          <Card key={l} style={{ padding: "14px 16px" }}>
            <div style={{ fontSize: 10, fontWeight: 700, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.07em", marginBottom: 6 }}>{l}</div>
            <div style={{ fontSize: 18, fontWeight: 800, color: c, fontFamily: mono ? "monospace" : "inherit" }}>{v}</div>
          </Card>
        ))}
      </div>

      {/* Search + filter */}
      <div style={{ display: "flex", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: 1, minWidth: 180 }}>
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search invoices or customers…"
            style={{ ...inputStyle, paddingLeft: 34 }} />
          <span style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", color: "#94a3b8" }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          </span>
        </div>
        {["all","unpaid","paid"].map(f => (
          <button key={f} onClick={() => setFilter(f)} style={{ padding: "8px 14px", borderRadius: 10, border: "1px solid", fontSize: 13, fontWeight: 600, cursor: "pointer", textTransform: "capitalize", background: filter === f ? "#0f172a" : "#fff", color: filter === f ? "#fff" : "#475569", borderColor: filter === f ? "#0f172a" : "#e2e8f0", fontFamily: "inherit" }}>
            {f}
          </button>
        ))}
      </div>

      {/* List */}
      {filtered.length === 0 ? (
        <Card style={{ textAlign: "center", padding: "52px 24px" }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>📄</div>
          <div style={{ fontWeight: 700, color: "#0f172a", marginBottom: 6 }}>No invoices yet</div>
          <div style={{ color: "#94a3b8", fontSize: 13, marginBottom: 16 }}>{invoices.length === 0 ? "Create your first invoice to get started." : "Try a different search or filter."}</div>
          {invoices.length === 0 && <Btn onClick={onNew} size="sm"><Icon d={IC.plus} size={13} /> Create Invoice</Btn>}
        </Card>
      ) : (
        <Card style={{ padding: 0, overflow: "hidden" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
            <thead>
              <tr style={{ background: "#f8fafc", borderBottom: "1px solid #f1f5f9" }}>
                {["Invoice #","Customer","Issue Date","Due Date","Amount","Status",""].map(h => (
                  <th key={h} style={{ padding: "10px 14px", textAlign: h === "Amount" ? "right" : "left", fontSize: 11, fontWeight: 700, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.06em" }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map((inv, i) => {
                const total = calcTotals(inv.items).total;
                return (
                  <tr key={inv.id} style={{ borderBottom: i < filtered.length - 1 ? "1px solid #f8fafc" : "none" }}>
                    <td style={{ padding: "10px 14px" }}>
                      <button onClick={() => onView(inv)} style={{ background: "none", border: "none", cursor: "pointer", fontFamily: "monospace", fontWeight: 700, fontSize: 13, color: "#0f172a", padding: 0 }}>{inv.number}</button>
                    </td>
                    <td style={{ padding: "10px 14px", color: "#475569" }}>{inv.customer.name || "—"}</td>
                    <td style={{ padding: "10px 14px", color: "#94a3b8" }}>{fmtDate(inv.issueDate)}</td>
                    <td style={{ padding: "10px 14px", color: "#94a3b8" }}>{fmtDate(inv.dueDate)}</td>
                    <td style={{ padding: "10px 14px", textAlign: "right", fontWeight: 700, color: "#0f172a", fontFamily: "monospace" }}>{fmt(total, sym)}</td>
                    <td style={{ padding: "10px 14px" }}><Badge status={inv.status} onClick={() => onToggle(inv.id)} /></td>
                    <td style={{ padding: "10px 14px" }}>
                      <div style={{ display: "flex", gap: 4, justifyContent: "flex-end" }}>
                        <Btn size="sm" variant="ghost" onClick={() => onView(inv)}><Icon d={IC.eye} size={13} /> View</Btn>
                        <Btn size="sm" variant="danger" onClick={() => { if (confirm("Delete this invoice?")) onDelete(inv.id); }}><Icon d={IC.trash} size={12} /></Btn>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </Card>
      )}
    </div>
  );
};

// ─── INVOICE FORM ─────────────────────────────────────────────────────────────
const emptyItem = vat => ({ id: uid(), desc: "", qty: 1, price: 0, vatRate: vat, discount: 0 });

const InvoiceForm = ({ existing, business, invoices, onSave, onCancel }) => {
  const sym = business.sym || "£";
  const [number,    setNumber]    = useState(existing?.number     || nextNum(invoices, business.prefix));
  const [issueDate, setIssueDate] = useState(existing?.issueDate  || today());
  const [dueDate,   setDueDate]   = useState(existing?.dueDate    || addDays(30));
  const [customer,  setCustomer]  = useState(existing?.customer   || { name: "", email: "", phone: "", address: "" });
  const [items,     setItems]     = useState(existing?.items      || [emptyItem(business.defaultVat)]);
  const [notes,     setNotes]     = useState(existing?.notes      || "");
  const [tab,       setTab]       = useState("edit");

  const setCust  = (k, v)  => setCustomer(c => ({ ...c, [k]: v }));
  const updItem  = (id, k, v) => setItems(prev => prev.map(it => it.id === id ? { ...it, [k]: v } : it));
  const addItem  = ()      => setItems(prev => [...prev, emptyItem(business.defaultVat)]);
  const remItem  = id      => setItems(prev => prev.filter(it => it.id !== id));

  const totals = calcTotals(items);

  const previewInvoice = useMemo(() => ({
    id: existing?.id || uid(), number, issueDate, dueDate, customer, items, notes, status: existing?.status || "unpaid",
  }), [number, issueDate, dueDate, customer, items, notes]);

  const doSave = status => {
    if (!customer.name.trim()) { alert("Please enter a customer name."); return; }
    if (items.every(it => !it.desc.trim())) { alert("Add at least one item description."); return; }
    onSave({ ...previewInvoice, status: status || existing?.status || "unpaid" });
  };

  const tabBtn = t => ({
    padding: "8px 16px", border: "none", cursor: "pointer", fontSize: 13, fontWeight: 600, fontFamily: "inherit",
    background: tab === t ? "#fff" : "transparent",
    color: tab === t ? "#0f172a" : "#94a3b8",
    borderBottom: tab === t ? "2px solid #0f172a" : "2px solid transparent",
    transition: "all .15s",
  });

  const VAT_OPTS = [{ value: 0, label: "0%" }, { value: 5, label: "5%" }, { value: 20, label: "20%" }];

  return (
    <div style={{ padding: "24px 0" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
        <Btn variant="ghost" size="sm" onClick={onCancel}><Icon d={IC.back} size={14} /> Back</Btn>
        <h1 style={{ margin: 0, fontSize: 20, fontWeight: 800, color: "#0f172a" }}>{existing ? "Edit Invoice" : "New Invoice"}</h1>
        <span style={{ fontFamily: "monospace", fontSize: 13, color: "#64748b", background: "#f1f5f9", padding: "3px 10px", borderRadius: 8 }}>{number}</span>
      </div>

      <div style={{ display: "flex", borderBottom: "1px solid #e2e8f0", marginBottom: 20 }}>
        <button style={tabBtn("edit")}  onClick={() => setTab("edit")}>✏️ Edit</button>
        <button style={tabBtn("preview")} onClick={() => setTab("preview")}>👁 Preview</button>
      </div>

      {tab === "preview" ? (
        <div>
          <div style={{ border: "1px solid #e2e8f0", borderRadius: 16, overflow: "hidden", marginBottom: 16 }}>
            <InvoicePreview invoice={previewInvoice} business={business} />
          </div>
          <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
            <Btn variant="secondary" onClick={() => setTab("edit")}><Icon d={IC.edit} size={14} /> Edit</Btn>
            <Btn variant="success"   onClick={() => doSave("paid")}><Icon d={IC.check} size={14} /> Save as Paid</Btn>
            <Btn                     onClick={() => doSave("unpaid")}><Icon d={IC.file} size={14} /> Save Invoice</Btn>
          </div>
        </div>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 280px", gap: 20 }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>

            {/* Invoice meta */}
            <Card>
              <SecTitle>Invoice Details</SecTitle>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 }}>
                <TInput label="Invoice Number" value={number}    onChange={setNumber} />
                <TInput label="Issue Date"     value={issueDate} onChange={setIssueDate} type="date" />
                <TInput label="Due Date"       value={dueDate}   onChange={setDueDate}   type="date" />
              </div>
            </Card>

            {/* Customer */}
            <Card>
              <SecTitle>Bill To</SecTitle>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                <TInput    label="Customer / Company Name *" value={customer.name}    onChange={v => setCust("name", v)}    placeholder="Acme Ltd" />
                <TInput    label="Email"                     value={customer.email}   onChange={v => setCust("email", v)}   type="email" placeholder="billing@acme.co.uk" />
                <TInput    label="Phone"                     value={customer.phone}   onChange={v => setCust("phone", v)}   placeholder="+44 7700 900000" />
                <TTextarea label="Address"                   value={customer.address} onChange={v => setCust("address", v)} rows={3} placeholder={"1 High St\nLondon\nW1A 1AA"} />
              </div>
            </Card>

            {/* Line items */}
            <Card>
              <SecTitle>Line Items</SecTitle>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {items.map(item => {
                  const { total } = calcLine(item);
                  return (
                    <div key={item.id} style={{ background: "#f8fafc", borderRadius: 12, padding: "12px 14px", border: "1px solid #f1f5f9" }}>
                      <div style={{ marginBottom: 10 }}>
                        <TInput value={item.desc} onChange={v => updItem(item.id, "desc", v)} placeholder="Description of service or product" />
                      </div>
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1.2fr 0.8fr 0.8fr auto", gap: 8, alignItems: "end" }}>
                        <TInput  label="Qty"           type="number" value={item.qty}      onChange={v => updItem(item.id, "qty",      parseFloat(v) || 0)} />
                        <TInput  label={`Price (${sym})`} type="number" value={item.price}  onChange={v => updItem(item.id, "price",    parseFloat(v) || 0)} />
                        <TInput  label="Disc %"        type="number" value={item.discount} onChange={v => updItem(item.id, "discount", parseFloat(v) || 0)} />
                        <TSelect label="VAT %"         value={item.vatRate} onChange={v => updItem(item.id, "vatRate", parseFloat(v))} options={VAT_OPTS} />
                        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                          <span style={{ fontSize: 10, fontWeight: 700, color: "#94a3b8", textTransform: "uppercase" }}>Total</span>
                          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                            <span style={{ fontFamily: "monospace", fontWeight: 700, fontSize: 13, color: "#0f172a", whiteSpace: "nowrap" }}>{fmt(total, sym)}</span>
                            <button onClick={() => remItem(item.id)} disabled={items.length === 1}
                              style={{ background: "none", border: "none", cursor: "pointer", color: "#f87171", padding: 2, opacity: items.length === 1 ? 0.3 : 1, display: "flex" }}>
                              <Icon d={IC.trash} size={14} />
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
                <button onClick={addItem} style={{ padding: "10px", borderRadius: 12, border: "2px dashed #e2e8f0", background: "none", cursor: "pointer", color: "#94a3b8", fontSize: 13, fontWeight: 500, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, fontFamily: "inherit" }}>
                  <Icon d={IC.plus} size={14} /> Add Line Item
                </button>
              </div>
            </Card>

            {/* Notes */}
            <Card>
              <SecTitle>Notes / Payment Terms</SecTitle>
              <TTextarea value={notes} onChange={setNotes} rows={3} placeholder="Payment due within 30 days. Bank transfers preferred." />
            </Card>
          </div>

          {/* Sidebar */}
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <Card style={{ position: "sticky", top: 20 }}>
              <SecTitle>Summary</SecTitle>
              <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 16 }}>
                {[["Subtotal", fmt(totals.subtotal, sym)], ...(totals.totalDisc > 0 ? [["Discount", `-${fmt(totals.totalDisc, sym)}`]] : []), ["VAT", fmt(totals.totalVat, sym)]].map(([l, v]) => (
                  <div key={l} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: "#64748b" }}><span>{l}</span><span>{v}</span></div>
                ))}
                <div style={{ height: 1, background: "#f1f5f9", margin: "4px 0" }} />
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span style={{ fontWeight: 700, fontSize: 14, color: "#0f172a" }}>Total</span>
                  <span style={{ fontFamily: "monospace", fontWeight: 800, fontSize: 18, color: "#0f172a" }}>{fmt(totals.total, sym)}</span>
                </div>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                <Btn onClick={() => doSave("unpaid")}><Icon d={IC.file} size={14} /> Save Invoice</Btn>
                <Btn variant="success" onClick={() => doSave("paid")}><Icon d={IC.check} size={14} /> Save as Paid</Btn>
                <Btn variant="ghost" size="sm" onClick={() => setTab("preview")}><Icon d={IC.eye} size={13} /> Preview</Btn>
              </div>
            </Card>
            <Card style={{ fontSize: 12, color: "#64748b" }}>
              <SecTitle>From</SecTitle>
              <div style={{ fontWeight: 700, color: "#0f172a", marginBottom: 3 }}>{business.name}</div>
              <div style={{ whiteSpace: "pre-line" }}>{business.address}</div>
              {business.vatNumber && <div style={{ marginTop: 4, color: "#94a3b8" }}>VAT: {business.vatNumber}</div>}
            </Card>
          </div>
        </div>
      )}
    </div>
  );
};

// ─── INVOICE DETAIL ───────────────────────────────────────────────────────────
const InvoiceDetail = ({ invoice, business, onBack, onEdit, onDelete, onToggle }) => {
  const handlePrint = () => {
    const el = document.getElementById("invoice-preview-print");
    if (!el) return;
    const w = window.open("", "_blank");
    w.document.write(`<!DOCTYPE html><html><head><title>${invoice.number}</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif}table{border-collapse:collapse}</style></head><body>${el.outerHTML}</body></html>`);
    w.document.close(); w.focus(); setTimeout(() => { w.print(); w.close(); }, 300);
  };

  return (
    <div style={{ padding: "24px 0" }}>
      {/* Toolbar — Print/Save as PDF · Edit · Delete */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 10 }}>
        <Btn variant="ghost" size="sm" onClick={onBack}><Icon d={IC.back} size={14} /> Dashboard</Btn>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {/* Print / Save as PDF — prominent primary style */}
          <button onClick={handlePrint} style={{ display: "inline-flex", alignItems: "center", gap: 7, padding: "9px 18px", borderRadius: 10, border: "none", cursor: "pointer", background: "#0f172a", color: "#fff", fontWeight: 700, fontSize: 13, fontFamily: "inherit", boxShadow: "0 1px 4px rgba(0,0,0,.18)", transition: "background .15s" }}
            onMouseEnter={e => e.currentTarget.style.background = "#1e3a5f"}
            onMouseLeave={e => e.currentTarget.style.background = "#0f172a"}>
            {/* PDF icon */}
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="9" y1="15" x2="15" y2="15"/>
              <line x1="9" y1="11" x2="15" y2="11"/>
            </svg>
            Print / Save as PDF
          </button>
          <Btn variant="secondary" size="sm" onClick={() => onEdit(invoice)}><Icon d={IC.edit} size={13} /> Edit</Btn>
          <Btn variant="danger"    size="sm" onClick={() => { if (confirm("Delete this invoice?")) onDelete(invoice.id); }}><Icon d={IC.trash} size={13} /> Delete</Btn>
        </div>
      </div>

      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 16 }}>
        <Badge status={invoice.status} onClick={() => onToggle(invoice.id)} />
        <span style={{ fontSize: 13, color: "#94a3b8" }}>Click badge to toggle paid / unpaid</span>
      </div>

      <div style={{ border: "1px solid #e2e8f0", borderRadius: 16, overflow: "hidden" }}>
        <InvoicePreview invoice={invoice} business={business} />
      </div>
    </div>
  );
};

// ─── SETTINGS ─────────────────────────────────────────────────────────────────
const Settings = ({ business: init, onSave }) => {
  const [form, setForm]   = useState({ ...init });
  const [saved, setSaved] = useState(false);
  const logoRef = useRef();

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const handleLogo = e => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { alert("Logo must be under 2 MB."); return; }
    const r = new FileReader();
    r.onload = () => set("logo", r.result);
    r.readAsDataURL(file);
  };

  const doSave = () => { onSave(form); setSaved(true); setTimeout(() => setSaved(false), 2500); };

  const CUR = [{ value: "GBP", label: "£ GBP – British Pound" }, { value: "USD", label: "$ USD – US Dollar" }, { value: "EUR", label: "€ EUR – Euro" }, { value: "AED", label: "AED – UAE Dirham" }, { value: "CAD", label: "CA$ – Canadian Dollar" }];
  const SYM = { GBP: "£", USD: "$", EUR: "€", AED: "د.إ", CAD: "CA$" };

  return (
    <div style={{ padding: "24px 0", maxWidth: 640 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 24 }}>
        <div>
          <h1 style={{ margin: 0, fontSize: 24, fontWeight: 800, color: "#0f172a", letterSpacing: "-0.02em" }}>Settings</h1>
          <p style={{ margin: "4px 0 0", color: "#64748b", fontSize: 13 }}>Your business details appear on every invoice</p>
        </div>
        <Btn onClick={doSave} variant={saved ? "success" : "primary"}>
          {saved ? <><Icon d={IC.check} size={14} /> Saved!</> : "Save Settings"}
        </Btn>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        {/* Logo */}
        <Card>
          <SecTitle>Business Logo</SecTitle>
          <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
            {form.logo
              ? <div style={{ position: "relative" }}>
                  <img src={form.logo} alt="" style={{ height: 60, maxWidth: 140, objectFit: "contain", borderRadius: 10, border: "1px solid #e2e8f0", padding: 6 }} />
                  <button onClick={() => set("logo", "")} style={{ position: "absolute", top: -6, right: -6, width: 20, height: 20, borderRadius: "50%", background: "#ef4444", border: "none", color: "#fff", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <Icon d={IC.x} size={10} />
                  </button>
                </div>
              : <div style={{ width: 80, height: 60, border: "2px dashed #e2e8f0", borderRadius: 10, display: "flex", alignItems: "center", justifyContent: "center", color: "#cbd5e1" }}>
                  <Icon d={IC.upload} size={22} />
                </div>
            }
            <div>
              <Btn variant="secondary" size="sm" onClick={() => logoRef.current.click()}><Icon d={IC.upload} size={13} /> {form.logo ? "Change" : "Upload Logo"}</Btn>
              <p style={{ fontSize: 11, color: "#94a3b8", marginTop: 4 }}>PNG or JPG, max 2 MB</p>
              <input ref={logoRef} type="file" accept="image/*" style={{ display: "none" }} onChange={handleLogo} />
            </div>
          </div>
        </Card>

        {/* Business info */}
        <Card>
          <SecTitle>Business Details</SecTitle>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <TInput    label="Business Name"            value={form.name}           onChange={v => set("name", v)} />
            <TInput    label="Email"     type="email"   value={form.email}          onChange={v => set("email", v)} />
            <TInput    label="Phone"                    value={form.phone}          onChange={v => set("phone", v)} />
            <TInput    label="Website"                  value={form.website || ""}  onChange={v => set("website", v)} placeholder="https://yourbusiness.co.uk" />
            <TTextarea label="Business Address"         value={form.address}        onChange={v => set("address", v)} rows={3} style={{ gridColumn: "1 / -1" }} />
            <TInput    label="VAT Number"               value={form.vatNumber || ""} onChange={v => set("vatNumber", v)} placeholder="GB123456789" />
            <TInput    label="Company Registration No." value={form.regNumber || ""} onChange={v => set("regNumber", v)} placeholder="12345678" />
          </div>
        </Card>

        {/* Bank */}
        <Card>
          <SecTitle>Bank Details</SecTitle>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 }}>
            <TInput label="Bank Name"      value={form.bankName      || ""} onChange={v => set("bankName", v)}      placeholder="Barclays" />
            <TInput label="Sort Code"      value={form.sortCode      || ""} onChange={v => set("sortCode", v)}      placeholder="00-00-00" />
            <TInput label="Account Number" value={form.accountNumber || ""} onChange={v => set("accountNumber", v)} placeholder="12345678" />
          </div>
        </Card>

        {/* Invoice defaults */}
        <Card>
          <SecTitle>Invoice Defaults</SecTitle>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 }}>
            <TInput  label="Invoice Prefix"    value={form.prefix}     onChange={v => set("prefix", v.toUpperCase())} placeholder="INV" />
            <TSelect label="Default VAT Rate"  value={form.defaultVat} onChange={v => set("defaultVat", parseFloat(v))} options={[{ value: 0, label: "0%" }, { value: 5, label: "5%" }, { value: 20, label: "20%" }]} />
            <TSelect label="Currency"          value={form.currency}   onChange={v => setForm(f => ({ ...f, currency: v, sym: SYM[v] || v }))} options={CUR} />
          </div>
        </Card>

        <Btn onClick={doSave} variant={saved ? "success" : "primary"}>
          {saved ? <><Icon d={IC.check} size={15} /> Settings Saved!</> : "Save Settings"}
        </Btn>
      </div>
    </div>
  );
};

// ─── APP ROOT ─────────────────────────────────────────────────────────────────
function App() {
  const [screen,   setScreen]   = useState("dashboard");
  const [biz,      setBiz]      = useState(STORE.getBiz());
  const [invoices, setInvoices] = useState(STORE.getInv());
  const [selected, setSelected] = useState(null);
  const [editing,  setEditing]  = useState(null);
  const [banner,   setBanner]   = useState(true);

  const refresh = () => setInvoices([...STORE.getInv()]);

  const handleSaveInv = inv => { STORE.saveInv(inv); refresh(); setSelected(inv); setScreen("view"); };
  const handleSaveBiz = b   => { STORE.saveBiz(b);  setBiz({ ...b }); };
  const handleView    = inv => { setSelected(inv);   setScreen("view"); };
  const handleEdit    = inv => { setEditing(inv);    setScreen("form"); };
  const handleNew     = ()  => { setEditing(null);   setScreen("form"); };
  const handleBack    = ()  => { setScreen("dashboard"); setSelected(null); setEditing(null); };
  const handleDelete  = id  => { STORE.delInv(id);  refresh(); setScreen("dashboard"); };
  const handleToggle  = id  => {
    STORE.toggle(id); refresh();
    if (selected?.id === id) setSelected(s => s ? { ...s, status: s.status === "paid" ? "unpaid" : "paid" } : s);
  };

  const NAV = [
    { id: "dashboard", label: "Invoices",    icon: IC.dashboard },
    { id: "newBtn",    label: "New Invoice", icon: IC.plus      },
    { id: "settings",  label: "Settings",    icon: IC.settings  },
  ];

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", background: "#f8fafc", fontFamily: "Inter,system-ui,sans-serif" }}>

      {/* Promo banner */}
      {banner && <PromoBanner onDismiss={() => setBanner(false)} />}

      {/* Body */}
      <div style={{ display: "flex", flex: 1, minHeight: 0 }}>

        {/* Sidebar */}
        <aside style={{ width: 204, background: "#0f172a", display: "flex", flexDirection: "column", padding: "18px 12px", gap: 4, flexShrink: 0 }}>
          {/* Logo mark */}
          <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "2px 10px 16px", marginBottom: 8, borderBottom: "1px solid #1e293b" }}>
            <div style={{ width: 28, height: 28, background: "#3b82f6", borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Icon d={IC.file} size={14} stroke="#fff" />
            </div>
            <span style={{ color: "#fff", fontWeight: 700, fontSize: 15, letterSpacing: "-0.01em" }}>Invoicer</span>
          </div>

          {NAV.map(({ id, label, icon }) => {
            const active = screen === id || (id === "dashboard" && (screen === "view" || screen === "dashboard"));
            const isNew  = id === "newBtn";
            return (
              <button key={id} onClick={() => isNew ? handleNew() : setScreen(id)}
                style={{ display: "flex", alignItems: "center", gap: 9, padding: "9px 12px", borderRadius: 10, border: "none", cursor: "pointer", background: isNew ? "#3b82f6" : active ? "#1e293b" : "transparent", color: isNew ? "#fff" : active ? "#fff" : "#64748b", fontSize: 13, fontWeight: 500, textAlign: "left", width: "100%", fontFamily: "inherit" }}>
                <Icon d={icon} size={15} stroke={isNew || active ? "#fff" : "#64748b"} />
                {label}
              </button>
            );
          })}

          {/* Outstanding count */}
          {invoices.length > 0 && (
            <div style={{ marginTop: "auto", padding: "10px 12px", background: "#1e293b", borderRadius: 10 }}>
              <div style={{ fontSize: 11, color: "#64748b", marginBottom: 4 }}>Outstanding</div>
              <div style={{ fontSize: 20, fontWeight: 800, color: "#fbbf24", fontFamily: "monospace" }}>{invoices.filter(i => i.status === "unpaid").length}</div>
              <div style={{ fontSize: 11, color: "#475569" }}>invoice{invoices.filter(i => i.status === "unpaid").length !== 1 ? "s" : ""}</div>
            </div>
          )}

          {/* Google Play Badge */}
          <div style={{ marginTop: invoices.length > 0 ? 12 : "auto", padding: "12px 0 4px", borderTop: "1px solid #1e293b" }}>
            <div style={{ fontSize: 10, color: "#475569", fontWeight: 600, letterSpacing: "0.07em", textTransform: "uppercase", marginBottom: 8, textAlign: "center" }}>Also on Android</div>
            <GooglePlayBadge width={180} />
          </div>
        </aside>

        {/* Main */}
        <main style={{ flex: 1, overflowY: "auto", padding: "0 24px" }}>
          {screen === "dashboard" && <Dashboard invoices={invoices} business={biz} onView={handleView} onNew={handleNew} onToggle={handleToggle} onDelete={handleDelete} />}
          {screen === "form"      && <InvoiceForm existing={editing} business={biz} invoices={invoices} onSave={handleSaveInv} onCancel={handleBack} />}
          {screen === "view"      && selected && <InvoiceDetail invoice={selected} business={biz} onBack={handleBack} onEdit={handleEdit} onDelete={handleDelete} onToggle={handleToggle} />}
          {screen === "settings"  && <Settings business={biz} onSave={handleSaveBiz} />}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
